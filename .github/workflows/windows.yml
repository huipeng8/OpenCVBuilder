name: windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        ver:
          - { cv: 4.12.0, jdk: 8, ant: 1.10.14 }
        list:
          - { win_ver: 2022, vs_name: vs2022, vs_ver: v143 }
        arch:
          - x64
          - x86
        crt:
          - md
          - mt

    runs-on: windows-${{ matrix.list.win_ver }}

    name: windows-${{ matrix.list.vs_name }}-${{ matrix.arch }}-${{ matrix.crt }}

    env:
      BUILD_SCRIPT: build-opencv4-win.ps1
      BUILD_OPTIONS: opencv4_cmake_options.txt
      PKG_NAME: opencv-${{ matrix.ver.cv }}-windows-${{ matrix.list.vs_name }}-${{ matrix.arch }}-${{ matrix.crt }}

    steps:
      - name: Set up JDK (optional, kept for compatibility)
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.ver.jdk }}'
          distribution: 'adopt'

      - uses: cedx/setup-ant@v2
        with:
          optional-tasks: true
          version: ${{ matrix.ver.ant }}

      - name: Checkout repo (scripts & config)
        uses: actions/checkout@v5

      - name: Checkout OpenCV
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv
          path: opencv-${{ matrix.ver.cv }}
          ref: ${{ matrix.ver.cv }}
          submodules: recursive

      - name: Checkout OpenCV Contrib
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv_contrib
          path: opencv_contrib
          ref: ${{ matrix.ver.cv }}

      - name: Copy build files
        run: |
          cp ${{ env.BUILD_SCRIPT }} opencv-${{ matrix.ver.cv }}
          cp ${{ env.BUILD_OPTIONS }} opencv-${{ matrix.ver.cv }}

      - name: Build OpenCV
        shell: powershell
        run: |
          cd opencv-${{ matrix.ver.cv }}
          .\${{ env.BUILD_SCRIPT }} -VsArch ${{ matrix.arch }} -VsVer ${{ matrix.list.vs_ver }} -VsCRT ${{ matrix.crt }}

      - name: Package
        run: |
          cp -r opencv-${{ matrix.ver.cv }}/build-${{ matrix.arch }}-${{ matrix.list.vs_ver }}-${{ matrix.crt }}/install ${{ env.PKG_NAME }}
          7z a ${{ env.PKG_NAME }}.7z ${{ env.PKG_NAME }}
          rm -r -fo ${{ env.PKG_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.7z

  release:
    needs: windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Generate changelog
        id: changelog
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "first")
          current=${GITHUB_REF#refs/tags/}
          log=$(git log $previous..$current --pretty=format:'- %cd %an: %s' --date=short)
          echo -e "$log\n" > release.md

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          bodyFile: release.md
          artifacts: "artifacts/*/*.7z"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
